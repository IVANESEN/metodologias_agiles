<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar acceso · Constructora El Salvador</title>
  <link rel="stylesheet" href="/styles.css"><link rel="icon" href="/favicon.svg">
  <script src="/recuperar.js" type="module"></script>
</head><body><main class="auth-page">
  <p class="eyebrow">CONSTRUCTORA EL SALVADOR</p><h1>Recuperar acceso</h1>
  <p>Escribe el correo de tu cuenta para solicitar un enlace de restablecimiento.</p>
  <form class="auth-form"><div class="field"><label for="correo">Correo electrónico</label>
    <input id="correo" name="correo" type="email" maxlength="254" autocomplete="email" required></div>
    <p id="auth-message" role="status" aria-live="polite"></p><button class="primary-button" type="submit">Solicitar enlace</button>
  </form><a href="/login.html">Volver a iniciar sesión</a>
</main></body></html>
