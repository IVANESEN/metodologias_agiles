<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Constructora El Salvador</title>
  <link rel="stylesheet" href="/styles.css"><link rel="icon" href="/favicon.svg">
  <script src="/login.js" type="module"></script>
</head>
<body><main class="auth-page">
  <p class="eyebrow">CONSTRUCTORA EL SALVADOR</p><h1>Iniciar sesión</h1>
  <form class="auth-form">
    <div class="field"><label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" maxlength="254" autocomplete="username" required></div>
    <div class="field"><label for="clave">Contraseña</label><input id="clave" name="clave" type="password" maxlength="256" autocomplete="current-password" required></div>
    <p id="auth-message" role="alert"></p><button class="primary-button" type="submit">Entrar</button>
  </form>
  <a href="/recuperar.html">¿Olvidaste tu contraseña?</a>
</main></body></html>
