services:
  - type: web
    name: metodologias-agiles-ci
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    # El despliegue lo ejecuta el job `deploy` de .github/workflows/pipeline.yml
    # (solo tras build y pruebas en verde). Evita despliegues duplicados.
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        # URI privada del proyecto Supabase elegido, introducida en Render.
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: DATABASE_SCHEMA
        value: constructora_private
      - key: DATABASE_SSL_CA_FILE
        value: database/certs/supabase-prod-ca-2021.crt
