<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Restablecer contraseña · Constructora El Salvador</title>
  <link rel="stylesheet" href="/styles.css"><link rel="icon" href="/favicon.svg">
  <script src="/restablecer.js" type="module"></script>
</head><body><main class="auth-page">
  <p class="eyebrow">CONSTRUCTORA EL SALVADOR</p><h1>Nueva contraseña</h1>
  <form class="auth-form">
    <div class="field"><label for="clave">Nueva contraseña</label><input id="clave" name="clave" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></div>
    <div class="field"><label for="confirmacion">Confirmar contraseña</label><input id="confirmacion" name="confirmacion" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></div>
    <p id="auth-message" role="alert"></p><button class="primary-button" type="submit">Guardar contraseña</button>
  </form><a href="/login.html">Volver a iniciar sesión</a>
</main></body></html>
